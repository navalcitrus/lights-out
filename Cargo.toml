[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Naval Citrus"]
description = "Generalised Lights Out over Z/kZ on surfaces, with a WebAssembly front end"
license = "MIT"
repository = "https://github.com/navalcitrus/lights-out"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
